services:
  finwise:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${FINWISE_PUBLISH_IP:-127.0.0.1}:${FINWISE_PUBLISH_PORT:-3000}:3000"
    volumes:
      - finwise-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  finwise-data:
