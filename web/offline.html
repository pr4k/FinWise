<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563c9" />
    <title>FinWise is offline</title>
    <style>
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f7f8fa; color: #202936; font: 16px system-ui, sans-serif; }
      main { max-width: 25rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.5rem; }
      p { line-height: 1.5; }
      button { border: 0; border-radius: .6rem; padding: .8rem 1.3rem; background: #2563c9; color: #fff; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>FinWise is offline</h1>
      <p>Reconnect to your NAS over Wi-Fi or private VPN, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
